<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>氣泡排序法視覺化 - 帶重置功能</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f0f2f5; }
        .container { display: flex; align-items: flex-end; height: 250px; gap: 8px; margin-bottom: 30px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bar { width: 35px; background-color: #3498db; text-align: center; color: white; font-size: 14px; font-weight: bold; border-radius: 4px 4px 0 0; transition: height 0.2s, background-color 0.2s; position: relative; }
        .bar.comparing { background-color: #e74c3c; transform: scaleX(1.1); }
        .bar.sorted { background-color: #2ecc71; }
        .controls { display: flex; gap: 15px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 6px; transition: 0.3s; }
        button:hover { background: #34495e; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #reset-btn { background: #95a5a6; }
    </style>
</head>
<body>

    <h2>氣泡排序法 (Bubble Sort) 演示</h2>
    <div class="container" id="bar-container"></div>
    
    <div class="controls">
        <button id="start-btn" onclick="startSort()">開始排序</button>
        <button id="reset-btn" onclick="resetData()">重新開始</button>
    </div>

    <script>
        let data = [];
        const container = document.getElementById('bar-container');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');

        // 初始化或隨機生成數據
        function resetData() {
            // 生成 8 個 10-100 之間的隨機數
            data = Array.from({ length: 8 }, () => Math.floor(Math.random() * 90) + 10);
            renderBars();
            startBtn.disabled = false;
        }

        // 渲染長條圖
        function renderBars() {
            container.innerHTML = '';
            data.forEach(value => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${value * 2}px`;
                bar.innerText = value;
                container.appendChild(bar);
            });
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startSort() {
            startBtn.disabled = true;
            resetBtn.disabled = true; // 排序時不建議重置，避免邏輯衝突
            
            const bars = document.querySelectorAll('.bar');
            const n = data.length;

            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    bars[j].classList.add('comparing');
                    bars[j + 1].classList.add('comparing');

                    await sleep(200);

                    if (data[j] > data[j + 1]) {
                        // 交換邏輯
                        [data[j], data[j + 1]] = [data[j + 1], data[j]];
                        
                        // 更新 DOM 狀態
                        updateBar(bars[j], data[j]);
                        updateBar(bars[j+1], data[j+1]);
                    }

                    await sleep(100);
                    bars[j].classList.remove('comparing');
                    bars[j + 1].classList.remove('comparing');
                }
                // 標示該輪已就位的最大值
                bars[n - i - 1].classList.add('sorted');
            }
            bars[0].classList.add('sorted');
            resetBtn.disabled = false;
        }

        function updateBar(barElement, value) {
            barElement.style.height = `${value * 2}px`;
            barElement.innerText = value;
        }

        // 頁面載入時初始化
        resetData();
    </script>
</body>
</html>
