<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Bubble Sort Visualizer</title>
    <style>
        :root { --primary-color: #3498db; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; padding: 50px; }
        .bar-container { display: flex; align-items: flex-end; height: 200px; gap: 5px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .bar { width: 30px; background: var(--primary-color); color: white; text-align: center; font-size: 12px; transition: 0.2s; border-radius: 3px 3px 0 0; }
        .comparing { background: #e74c3c !important; }
        .sorted { background: #2ecc71 !important; }
        .controls { margin-top: 30px; display: flex; gap: 15px; align-items: center; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <h2>氣泡排序法視覺化作業</h2>
    <div class="bar-container" id="container"></div>
    <div class="controls">
        <input type="color" id="picker" value="#3498db" onchange="document.documentElement.style.setProperty('--primary-color', this.value)">
        <button onclick="startSort()" id="btn-start">開始排序</button>
        <button onclick="init()">重新生成</button>
    </div>
    <script>
        let arr = [];
        const container = document.getElementById('container');
        function init() {
            arr = Array.from({length: 10}, () => Math.floor(Math.random() * 90) + 10);
            container.innerHTML = arr.map(v => `<div class="bar" style="height:${v*2}px">${v}</div>`).join('');
            document.getElementById('btn-start').disabled = false;
        }

            document.getElementById('btn-start').disabled = true;
