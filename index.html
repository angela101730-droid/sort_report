<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排序視覺化首頁</title>

<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-color: #1e293b;
    }

    body {
        font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        background: var(--primary-gradient);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    /* 裝飾背景球 */
    .bg-circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        z-index: -1;
        animation: float 10s infinite alternate ease-in-out;
    }

    @keyframes float {
        from { transform: translate(0, 0); }
        to { transform: translate(20px, 40px); }
    }

    .card {
        background: var(--card-bg);
        padding: 50px 30px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px; /* 窄版設計，更像 App */
        text-align: center;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        color: var(--text-color);
        margin-top: 0;
        margin-bottom: 35px;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .btn-group {
        display: flex;
        flex-direction: column; /* 強制直式排列 */
        gap: 16px;
    }

    a {
        text-decoration: none;
        color: white;
        padding: 18px;
        border-radius: 16px;
        font-size: 1.1rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* 為每個按鈕定義顏色 */
    .btn-bubble { background: #f43f5e; }    /* 玫瑰紅 */
    .btn-selection { background: #06b6d4; } /* 寶石藍 */
    .btn-insertion { background: #8b5cf6; } /* 紫羅蘭 */
    .btn-merge { background: #10b981; }     /* 翡翠綠 */

    a:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        filter: brightness(1.1);
    }

    a:active {
        transform: scale(0.98);
    }

    /* 按鈕前的裝飾符號 */
    a::before {
        content: "◈";
        margin-right: 10px;
        font-size: 1.2rem;
        opacity: 0.8;
    }

</style>
</head>

<body>

<div class="bg-circle" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
<div class="bg-circle" style="width: 200px; height: 200px; bottom: -50px; right: -50px; animation-delay: -2s;"></div>

<div class="card">
    <h1>排序演算法視覺化</h1>

    <div class="btn-group">
        <a href="bubblesort.html" class="btn-bubble">氣泡排序法</a>
        <a href="selection.html" class="btn-selection">選擇排序法</a>
        <a href="insertion.html" class="btn-insertion">插入排序法</a>
        <a href="merge.html" class="btn-merge">合併排序法</a>
    </div>
</div>

</body>
</html>
