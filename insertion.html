<script>
    let data = [];
    const container = document.getElementById('bar-container');
    const startBtn = document.getElementById('start-btn');
    const stepBtn = document.getElementById('step-btn');
    const resetBtn = document.getElementById('reset-btn');
    const colorPicker = document.getElementById('color-picker');

    // 排序狀態
    let isSorting = false;
    let currentI = 1;
    let currentJ = 0;
    let key = null;
    let bars = [];

    function goHome() {
        window.location.href = 'index.html';
    }

    function changeColor(color) {
        document.documentElement.style.setProperty('--primary-color', color);
    }

    function resetData() {
        data = Array.from({ length: 10 }, () => Math.floor(Math.random() * 90) + 10);
        renderBars();
        startBtn.disabled = false;
        stepBtn.disabled = false;
        resetBtn.disabled = false;
        colorPicker.disabled = false;
        isSorting = false;
        currentI = 1;
        currentJ = 0;
        key = null;
        bars.forEach(b => b.classList.remove('sorted', 'comparing'));
    }

    function renderBars() {
        container.innerHTML = '';
        bars = [];
        data.forEach(value => {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            bar.style.height = `${value * 2}px`;
            bar.innerText = value;
            container.appendChild(bar);
            bars.push(bar);
        });
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function startSort() {
        if (isSorting) return;
        isSorting = true;

        startBtn.disabled = true;
        stepBtn.disabled = true;
        resetBtn.disabled = true;
        colorPicker.disabled = true;

        const n = data.length;

        for (let i = 1; i < n; i++) {
            key = data[i];
            let j = i - 1;

            bars[i].classList.add('comparing');

            await sleep(200);

            while (j >= 0 && data[j] > key) {
                bars[j].classList.add('comparing');

                await sleep(150);

                data[j + 1] = data[j];
                updateBar(bars[j + 1], data[j + 1]);

                bars[j].classList.remove('comparing');
                j--;
            }

            data[j + 1] = key;
            updateBar(bars[j + 1], key);

            bars[i].classList.remove('comparing');
        }

        bars.forEach(b => b.classList.add('sorted'));

        isSorting = false;
        resetBtn.disabled = false;
        colorPicker.disabled = false;
    }

    async function stepSort() {
        if (isSorting) return;
        isSorting = true;

        startBtn.disabled = true;
        resetBtn.disabled = true;
        colorPicker.disabled = true;

        const n = data.length;

        if (currentI >= n) {
            bars.forEach(b => b.classList.add('sorted'));
            stepBtn.disabled = true;
            resetBtn.disabled = false;
            colorPicker.disabled = false;
            isSorting = false;
            return;
        }

        if (key === null) {
            key = data[currentI];
            currentJ = currentI - 1;
        }

        if (currentJ >= 0 && data[currentJ] > key) {
            bars[currentJ].classList.add('comparing');

            await sleep(150);

            data[currentJ + 1] = data[currentJ];
            updateBar(bars[currentJ + 1], data[currentJ + 1]);

            bars[currentJ].classList.remove('comparing');
            currentJ--;
        } else {
            data[currentJ + 1] = key;
            updateBar(bars[currentJ + 1], key);

            key = null;
            currentI++;
        }

        isSorting = false;
    }

    function updateBar(barElement, value) {
        barElement.style.height = `${value * 2}px`;
        barElement.innerText = value;
    }

    resetData();
</script>
