<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>插入排序法示範</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        #output {
            margin-top: 20px;
            white-space: pre-line;
            background: #f4f4f4;
            padding: 10px;
        }
    </style>
</head>
<body>

<h2>插入排序法 (Insertion Sort)</h2>

<label>輸入數字（用逗號分隔）：</label><br>
<input type="text" id="numbers" value="5,3,8,4,2">
<button onclick="insertionSort()">排序</button>

<div id="output"></div>

<script>
function insertionSort() {
    let input = document.getElementById("numbers").value;
    let arr = input.split(",").map(Number);
    let output = document.getElementById("output");

    let steps = "排序過程：\n";

    for (let i = 1; i < arr.length; i++) {
        let key = arr[i];
        let j = i - 1;

        steps += `\n第 ${i} 回合，key = ${key}\n`;

        while (j >= 0 && arr[j] > key) {
            arr[j + 1] = arr[j];
            j--;
            steps += arr.join(", ") + "\n";
        }

        arr[j + 1] = key;
        steps += "插入後: " + arr.join(", ") + "\n";
    }

    steps += "\n排序結果: " + arr.join(", ");
    output.textContent = steps;
}
</script>

</body>
</html>
