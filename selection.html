<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>選擇排序視覺化（完整版）</title>

<style>
:root {
    --primary-color: #3498db;
}

body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    background: #f0f2f5;
}

h2 {
    margin-bottom: 10px;
}

.info {
    margin-bottom: 15px;
    color: #555;
}

.container {
    display: flex;
    align-items: flex-end;
    height: 260px;
    gap: 8px;
    margin-bottom: 25px;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.bar {
    width: 35px;
    background-color: var(--primary-color);
    text-align: center;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border-radius: 4px 4px 0 0;
    transition: 0.2s;
}

.bar.comparing { background:#e74c3c !important; }
.bar.min { background:#f1c40f !important; }
.bar.sorted { background:#2ecc71 !important; }

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    background: white;
    padding: 15px 20px;
    border-radius: 50px;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background:#2c3e50;
    color:white;
    cursor:pointer;
}

button:hover { opacity:0.9; }

.home-btn {
    background:#e67e22;
}

.home-btn:hover {
    background:#d35400;
}

input[type="range"] {
    width: 120px;
}
</style>
</head>

<body>

<h2>選擇排序法視覺化</h2>

<div class="info">
    比較次數：<span id="compare-count">0</span>　
    交換次數：<span id="swap-count">0</span>
</div>

<div class="container" id="bar-container"></div>

<div class="controls">
    <button class="home-btn" onclick="goHome()">回首頁</button>

    <input type="color" value="#3498db" onchange="changeColor(this.value)">

    <button onclick="startSort()">開始排序</button>
    <button onclick="stepSort()">下一步</button>
    <button onclick="resetData()">重置</button>

    <label>速度</label>
    <input type="range" min="50" max="500" value="150" id="speed">
</div>

<script>
let data = [];
let bars = [];

let i = 0;
let j = 1;
let minIndex = 0;
let isSorting = false;

let compareCount = 0;
let swapCount = 0;

const container = document.getElementById('bar-container');

function goHome(){
    window.location.href = "index.html";
}

function changeColor(color){
    document.documentElement.style.setProperty('--primary-color', color);
}

function resetData(){
    data = Array.from({length:10},()=>Math.floor(Math.random()*90)+10);
    i = 0; j = 1; minIndex = 0;
    compareCount = 0;
    swapCount = 0;
    updateInfo();
    renderBars();
}

function updateInfo(){
    document.getElementById('compare-count').innerText = compareCount;
    document.getElementById('swap-count').innerText = swapCount;
}

function renderBars(){
    container.innerHTML = '';
    bars = [];
    data.forEach(val=>{
        const bar = document.createElement('div');
        bar.className='bar';
        bar.style.height = val*2+'px';
        bar.innerText = val;
        container.appendChild(bar);
        bars.push(bar);
    });
}

function updateBar(i){
    bars[i].style.height = data[i]*2+'px';
    bars[i].innerText = data[i];
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));

function getSpeed(){
    return document.getElementById('speed').value;
}

async function startSort(){
    if(isSorting) return;
    isSorting = true;

    let n = data.length;

    for(i=0;i<n-1;i++){
        minIndex = i;
        bars[minIndex].classList.add('min');

        for(j=i+1;j<n;j++){
            bars[j].classList.add('comparing');

            compareCount++;
            updateInfo();

            await sleep(getSpeed());

            if(data[j] < data[minIndex]){
                bars[minIndex].classList.remove('min');
                minIndex = j;
                bars[minIndex].classList.add('min');
            }

            bars[j].classList.remove('comparing');
        }

        if(minIndex !== i){
            [data[i], data[minIndex]] = [data[minIndex], data[i]];
            swapCount++;
            updateInfo();
            updateBar(i);
            updateBar(minIndex);
        }

        bars[minIndex].classList.remove('min');
        bars[i].classList.add('sorted');
    }

    bars[data.length-1].classList.add('sorted');
    isSorting = false;
}

async function stepSort(){
    if(isSorting) return;
    isSorting = true;

    let n = data.length;

    if(i >= n-1){
        bars[n-1].classList.add('sorted');
        isSorting=false;
        return;
    }

    if(j === i+1){
        minIndex = i;
        bars[minIndex].classList.add('min');
    }

    if(j < n){
        bars[j].classList.add('comparing');

        compareCount++;
        updateInfo();

        await sleep(getSpeed());

        if(data[j] < data[minIndex]){
            bars[minIndex].classList.remove('min');
            minIndex = j;
            bars[minIndex].classList.add('min');
        }

        bars[j].classList.remove('comparing');
        j++;
    }else{
        if(minIndex !== i){
            [data[i], data[minIndex]] = [data[minIndex], data[i]];
            swapCount++;
            updateInfo();
            updateBar(i);
            updateBar(minIndex);
        }

        bars[minIndex].classList.remove('min');
        bars[i].classList.add('sorted');

        i++;
        j = i+1;
    }

    isSorting=false;
}

resetData();
</script>

</body>
</html>
